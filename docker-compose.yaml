services:
  teacher_db:
    image: pgvector/pgvector:pg17
    ports:
      - "8089:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - teacher_db:/var/lib/postgresql/data
  redis:
    image: redis:alpine
    ports:
      - "6380:6379"
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      REDIS_USER: ${REDIS_USER}
    command: ["redis-server", "/usr/local/etc/redis/redis.conf", "--requirepass", "${REDIS_PASSWORD}"]
    volumes:
      - redis_data:/data
      - ./redis/redis.conf:/usr/local/etc/redis/redis.conf:ro
  tei:
    # arm64 native on Apple Silicon (amd64+bge-m3 was OOM / exit 137)
    image: ghcr.io/huggingface/text-embeddings-inference:cpu-arm64-latest
    ports:
      - "8084:80"
    volumes:
      - tei:/data
    environment:
      - MODEL_ID=BAAI/bge-small-en-v1.5
    command: ["--model-id", "BAAI/bge-small-en-v1.5", "--auto-truncate"]

volumes:
  teacher_db:
  redis_data:
  tei:
